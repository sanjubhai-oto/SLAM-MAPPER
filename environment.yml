# RoboStack ROS2 Humble env for slam_rover (macOS arm64 / linux)
#
# Install:
#   mamba env create -f environment.yml
#   mamba activate slam_rover
#
name: slam_rover
channels:
  - conda-forge
  - robostack-staging
dependencies:
  - python=3.11
  - ros-humble-desktop
  - ros-humble-ros-gz                 # bridge for gz Harmonic (8.x)
  - ros-humble-ros-gz-bridge
  - ros-humble-ros-gz-image
  - ros-humble-ros-gz-sim
  - ros-humble-image-transport
  - ros-humble-image-transport-plugins
  - ros-humble-cv-bridge
  - ros-humble-tf-transformations
  - ros-humble-rmw-cyclonedds-cpp
  - colcon-common-extensions
  - compilers
  - cmake
  - ninja
  - pkg-config
  - numpy
  - opencv
  - yaml-cpp
  - eigen
  - suitesparse
  - pip
  - pip:
      - empy==3.3.4
      - lark
