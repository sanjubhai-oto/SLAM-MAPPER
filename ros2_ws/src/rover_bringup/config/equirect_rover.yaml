# stella_vslam config for equirectangular camera produced by fisheye_to_equirect.
# Reference: https://stella-cv.readthedocs.io/en/latest/example.html#equirectangular-camera-model
#
Camera:
  name: "rover_360cam_equirect"
  setup: "monocular"
  model: "equirectangular"
  fps: 20.0
  cols: 1600
  rows: 800
  color_order: "RGB"

Preprocessing:
  min_size: 800
  max_num_keypoints: 2000

Feature:
  name: "default ORB feature extraction setting"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.95

Tracking:
  enable_auto_relocalization: true
  use_robust_matcher_for_relocalization_request: true

PangolinViewer:
  keyframe_size: 0.07
  keyframe_line_width: 1
  graph_line_width: 1.0
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.65
  viewpoint_z: -1.9
  viewpoint_f: 400
